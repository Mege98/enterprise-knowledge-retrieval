name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  release-readiness:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m compileall -q launcher.py rag_core.py enterprise_knowledge_retrieval.py
      - run: python -m unittest -v test_release_readiness.py
